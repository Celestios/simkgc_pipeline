# SimKGC Configuration for Persian + English Knowledge Graph Completion

model:
  backbone_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  prune_vocab_to_fa_en: false
  target_languages: ["fa", "en"]
  output_dimensions: [256]       # Standard 256d embedding space
  max_seq_length: 64

distillation:
  enabled: true                  # Teacher-student distillation mode
  teacher_model: "BAAI/bge-m3"   # 560M state-of-the-art multilingual teacher
  teacher_cache_path: "cache/bge_m3_concept_targets.npy"
  teacher_dict_path: "cache/concepts_dict.json"
  alpha: 0.6                     # 60% direct teacher cosine alignment, 40% contrastive matching

training:
  batch_size: 512
  learning_rate: 1.5e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  num_train_epochs: 15
  temperature: 0.05
  use_fp16: true
  logging_steps: 50
  seed: 42

data:
  train_files:
    - "data/raw/conceptnet_clean.json"
  train_split: 0.85
  eval_split: 0.15
  seed: 42

export:
  checkpoint_dir: "checkpoints/simkgc_fa_en"
  onnx_output_path: "exports/simkgc_256d.onnx"
  quantized_onnx_path: "exports/simkgc_256d_int8.onnx"
  concept_binary_path: "exports/concepts_256d_int8.bin"
  concept_dict_path: "exports/concepts_dict.json"
  max_production_concepts: 50000
  persian_quota: 15000
  english_quota: 35000
